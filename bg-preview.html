<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<title>BG variants — light mode preview</title>
<link rel="stylesheet" href="style.css?v=mitv19"/>
<style>
  body { margin: 0; padding: 24px; font-family: ui-sans-serif, system-ui; background: #2a2a2a; color: #fff; }
  h1 { font-size: 14px; font-weight: 600; margin: 0 0 12px; opacity: 0.7; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .cell { position: relative; height: 130px; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.3); }
  .cell .label { position: absolute; bottom: 8px; left: 10px; z-index: 2; font-size: 11px; color: #2a221c; background: rgba(255,255,255,0.85); padding: 3px 8px; border-radius: 4px; font-weight: 600; }
  .cell .bg { position: absolute; inset: 0; }
  .cell .bg .bg-layer { position: absolute !important; inset: 0 !important; }
  .bg-svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<h1>Light-mode background variants — 13 total</h1>
<div class="grid" id="grid"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.__BG_OWNED_BY_HERO = true;</script>
<script type="text/babel" src="bg.jsx?v=bgv9"></script>
<script type="text/babel">
  const variants = ["horizon","grain","enso","sumi","washi","mist","paper","linen","garden","stone","dawn","dusk","snow"];
  const grid = document.getElementById('grid');
  const Bg = window.BackgroundLayer;
  variants.forEach(v => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = `<div class="bg" id="bg-${v}"></div><div class="label">${v}</div>`;
    grid.appendChild(cell);
    const target = cell.querySelector('.bg');
    ReactDOM.createRoot(target).render(<Bg variant={v} />);
  });
</script>
</body>
</html>
